<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>サブ2｜待ち番号・呼出状況</title><style>
:root{color-scheme:dark;font-family:system-ui,"Yu Gothic UI",sans-serif;background:#101827;color:#f8fafc}*{box-sizing:border-box}body{margin:0;padding:clamp(14px,3vw,32px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,42px);margin:0}#status{color:#93c5fd;font-size:14px}h2{color:#cbd5e1}.big{font-size:clamp(90px,24vw,240px);font-weight:900;text-align:center;line-height:1.1;margin:5vh 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:18px}.num{font-size:clamp(34px,7vw,64px);font-weight:900}.empty{color:#94a3b8;text-align:center;padding:30px;font-size:clamp(20px,3vw,32px)}.note{color:#94a3b8;font-size:14px;margin-top:24px}a{color:#93c5fd}
</style></head><body><header><h1>サブ2｜待ち番号・呼出状況</h1><div id="status">ntfy.shに接続中…</div></header><div id="view"><div class="empty">表示データを待っています…</div></div><p class="note">表示専用画面。操作はできません。</p><script>
const TOPIC='numcall-66abfc3b63208f53';let state={cur:'',wait:[],hist:[],orders:{},menu:{},fac:'',ts:0};const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let out='';out='<h2>お待ちの番号</h2><div class="grid">'+((state.wait||[]).map(n=>'<div class="card"><div class="num">'+esc(n)+'</div></div>').join('')||'<div class="empty">待機中の番号はありません</div>')+'</div><h2>呼出中</h2>'+(state.cur?'<div class="card"><div class="num">'+esc(state.cur)+'</div></div>':'<div class="empty">現在呼出中の番号はありません</div>'); $('view').innerHTML=out}const es=new EventSource('https://ntfy.sh/'+encodeURIComponent(TOPIC)+'/sse?since=latest');es.onopen=()=>$('status').textContent='● ntfy.sh接続中';es.onerror=()=>$('status').textContent='接続を再試行中…';es.onmessage=e=>{try{const msg=JSON.parse(e.data);if(msg.event!=='message'||!msg.message)return;const s=JSON.parse(msg.message);if(s.kind!=='numcall-display-v1')return;state=s;render()}catch(_ ){}};render();
</script></body></html>
